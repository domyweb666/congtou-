name: 打包

# 手動按 Run workflow 才跑，或推一個 v 開頭的標籤（例：v0.4.0）。平常 push 不會跑。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      # 專案的 Secrets 裡有 Apple 憑證就簽章並送公證；沒有就退回本機簽章，照樣打包得出來
      - name: 打包 Mac 版
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 公證優先用 App Store Connect API 金鑰（.p8），不用 App 專用密碼
          API_KEY_P8_BASE64: ${{ secrets.MAC_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          API_ISSUER: ${{ secrets.MAC_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$API_KEY_P8_BASE64" ]; then
              echo "[pack-mac] 公證用 API 金鑰 $API_KEY_ID" >&2
              printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" APPLE_API_KEY_ID="$API_KEY_ID" APPLE_API_ISSUER="$API_ISSUER"
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            fi
            echo "[pack-mac] 有憑證：Developer ID 簽章並送 Apple 公證" >&2
            npm run pack:mac
          else
            echo "[pack-mac] 沒有憑證：改用本機簽章，打開時會被 Mac 擋一次" >&2
            unset CSC_LINK CSC_KEY_PASSWORD
            npm run build
            npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
          fi
      # 確認簽章與公證真的成功（沒憑證時跳過）
      - name: 檢查簽章
        if: ${{ env.HAS_CERT == 'true' }}
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            xcrun stapler validate "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe
