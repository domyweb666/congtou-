name: 打包

# 手動按 Run workflow 才跑，或推一個 v 開頭的標籤（例：v0.4.0）。平常 push 不會跑。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run pack:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe
