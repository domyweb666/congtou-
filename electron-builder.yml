# 打包設定：npm run pack:win 做 Windows 安裝檔，npm run pack:mac 做 Mac 的 dmg（要在 Mac 上跑）
appId: org.domyweb.congcongdiu
productName: 蔥蔥丟
directories:
  output: dist
# 介面已經先打包成 src/renderer/app.js，所以不用帶 node_modules，也不帶原始的 app.src.js
files:
  - src/**/*
  - "!src/renderer/app.src.js"
  - assets/**/*
  - package.json
npmRebuild: false
publish: null

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]

# Windows 安裝程式：裝在使用者自己的資料夾，不用系統管理員權限
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 蔥蔥丟
  language: "1028"
  artifactName: congcongdiu-${version}-win-x64-setup.${ext}

mac:
  icon: assets/icon.icns
  category: public.app-category.productivity
  # 用 Developer ID Application 憑證簽章，再送 Apple 公證，Mac 打開時就不會擋。
  # 憑證與帳號從環境變數來：CSC_LINK、CSC_KEY_PASSWORD、APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID。
  # 沒有憑證時（例如自己的 Mac 上試打包），加上這三個參數改回本機簽章：
  #   -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: congcongdiu-${version}-mac-${arch}.${ext}
  # 通用版：一個 dmg 同時能跑在 M 系列和 Intel 的 Mac，給別人下載不用先查晶片
  target:
    - target: dmg
      arch: [universal]
